<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZCOFFEE | Dashboard</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><clipPath id='s'><rect width='100' height='100' rx='30'/></clipPath></defs><g clip-path='url(%23s)'><rect width='50' height='100' fill='%232d2a26'/><rect x='50' width='50' height='100' fill='%23b48c68'/><text y='72' x='50' text-anchor='middle' font-family='Georgia,serif' font-weight='900' font-size='65' fill='%23faf9f6'>Z</text></g></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f6;
            --text: #2d2a26;
            --accent: #b48c68;
            --cream: #f4eee8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
        }

        .pro-card {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease-out;
        }

        .pro-card:hover {
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(180, 140, 104, 0.1);
            transform: translateY(-2px);
        }

        .btn-premium {
            background: var(--text);
            color: white;
            transition: all 0.3s;
        }

        .btn-premium:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }
    </style>
</head>

<body class="bg-[#faf9f6]">
    <div id="body-content" class="hidden min-h-screen">
        <!-- Navigation -->
        <nav
            class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-bottom border-black/5 px-4 py-4 md:px-10 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#2d2a26] rounded-xl flex items-center justify-center shadow-sm">
                    <svg width="20" height="20" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#b48c68" d="M2 2h6v1H4v1h4v1H2v1h6v1H2V2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-sm font-bold uppercase tracking-widest text-[#2d2a26]">ZCOFFEE</h1>
                    <p class="text-[9px] text-[#b48c68] font-bold uppercase tracking-tighter" id="userName">Admin</p>
                </div>
            </div>

            <button onclick="handleLogout()"
                class="px-5 py-2.5 rounded-xl bg-red-50 text-red-600 text-xs font-bold uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all">Déconnexion</button>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-6 md:py-10">
            <!-- Header Section -->
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
                <div>
                    <h2 class="text-3xl md:text-5xl font-bold tracking-tight mb-2">Tableau de Bord</h2>
                    <p class="text-sm text-[#b48c68] font-medium">Gestion autonome du menu ZCOFFEE.</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="handleClearMenu()"
                        class="px-6 py-3 rounded-xl border border-red-200 text-red-600 text-xs font-bold uppercase tracking-widest hover:bg-red-50 transition-all flex items-center gap-2">
                        Vider
                    </button>
                    <button onclick="handleRestoreMenu()"
                        class="px-6 py-3 rounded-xl border border-black text-black text-xs font-bold uppercase tracking-widest hover:bg-black hover:text-white transition-all flex items-center gap-2">
                        Restaurer
                    </button>
                    <button onclick="openModal()"
                        class="px-8 py-3 rounded-xl bg-black text-white text-xs font-bold uppercase tracking-widest hover:bg-[#b48c68] transition-all">
                        Ajouter
                    </button>
                </div>
            </div>

            <div id="loading" class="text-center py-20 opacity-20 font-bold uppercase tracking-widest text-xs">
                Chargement...
            </div>

            <div id="menuList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Items injectés -->
            </div>
        </main>

        <!-- Modal -->
        <div id="modal"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[100]">
            <div class="bg-white rounded-3xl p-10 w-full max-w-lg shadow-2xl">
                <h3 id="modalTitle" class="text-xl font-bold mb-6">Article</h3>
                <form id="itemForm" class="space-y-4">
                    <input type="hidden" id="editId">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="category" placeholder="Catégorie (FR)" class="w-full bg-gray-50 p-4 rounded-xl outline-none" required>
                        <input type="text" id="categoryAr" placeholder="Catégorie (AR)" class="w-full bg-gray-50 p-4 rounded-xl outline-none text-right" dir="rtl" required>
                    </div>
                    <input type="text" id="nameFr" placeholder="Nom (FR)" class="w-full bg-gray-50 p-4 rounded-xl outline-none" required>
                    <input type="text" id="nameAr" placeholder="Nom (AR)" class="w-full bg-gray-50 p-4 rounded-xl outline-none text-right" dir="rtl" required>
                    <input type="text" id="price" placeholder="Prix (DT)" class="w-full bg-gray-50 p-4 rounded-xl outline-none" required>
                    <div class="flex gap-2 pt-4">
                        <button type="submit" class="btn-premium flex-1 py-4 rounded-xl font-bold uppercase tracking-widest text-[10px]">Enregistrer</button>
                        <button type="button" onclick="closeModal()" class="flex-1 py-4 border border-black/10 rounded-xl font-bold uppercase tracking-widest text-[10px]">Annuler</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { protectRoute, logout, getMenuItems, addMenuItem, updateMenuItem, deleteMenuItem, clearMenu, restoreMenu, sanitize } from "./security_utils.js";

        // Initialisation
        async function init() {
            const ok = await protectRoute();
            if (ok) {
                document.getElementById('body-content').classList.remove('hidden');
                loadMenu();
            }
        }
        init();

        window.handleLogout = logout;

        async function loadMenu() {
            const list = document.getElementById('menuList');
            const loading = document.getElementById('loading');
            list.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const items = await getMenuItems();
                loading.classList.add('hidden');

                if (items.length === 0) {
                    list.innerHTML = `<div class="col-span-full py-20 text-center opacity-30 font-bold uppercase tracking-widest text-[10px]">Menu vide.</div>`;
                    return;
                }

                items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'pro-card p-6 rounded-2xl flex flex-col justify-between gap-6';

                    const category = sanitize(item.category);
                    const nameFr = sanitize(item.nameFr);
                    const nameAr = sanitize(item.nameAr);
                    const price = sanitize(item.price);

                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[8px] font-bold uppercase tracking-[0.2em] bg-[#b48c68]/10 text-[#b48c68] px-3 py-1 rounded-md">${category}</span>
                            </div>
                            <h4 class="font-bold text-base mb-1">${nameFr}</h4>
                            <p class="text-xs font-bold opacity-30" dir="rtl">${nameAr}</p>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-black/5">
                            <div class="text-xl font-bold text-[#b48c68]">${price}<span class="text-[9px] opacity-40 ml-1 uppercase">DT</span></div>
                            <div class="flex gap-2" id="actions-${item.id}">
                            </div>
                        </div>
                    `;

                    const actionsDiv = card.querySelector(`#actions-${item.id}`);

                    const editBtn = document.createElement('button');
                    editBtn.className = "p-3 bg-gray-50 hover:bg-black hover:text-white rounded-xl transition-all text-[10px] font-bold uppercase";
                    editBtn.innerText = "Editer";
                    editBtn.onclick = () => window.editItem(item);

                    const delBtn = document.createElement('button');
                    delBtn.className = "p-3 bg-red-50 text-red-400 hover:bg-red-500 hover:text-white rounded-xl transition-all text-[10px] font-bold uppercase";
                    delBtn.innerText = "Suppr";
                    delBtn.onclick = () => window.handleDeleteItem(item.id);

                    actionsDiv.appendChild(editBtn);
                    actionsDiv.appendChild(delBtn);

                    list.appendChild(card);
                });
            } catch (err) { console.error(err); }
        }

        window.openModal = (item = null) => {
            document.getElementById('modal').classList.remove('hidden');
            if (item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('category').value = item.category;
                document.getElementById('categoryAr').value = item.categoryAr;
                document.getElementById('nameFr').value = item.nameFr;
                document.getElementById('nameAr').value = item.nameAr;
                document.getElementById('price').value = item.price;
            } else {
                document.getElementById('itemForm').reset();
                document.getElementById('editId').value = "";
            }
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.editItem = (item) => openModal(item);

        window.handleDeleteItem = async (id) => {
            if (confirm("Supprimer ?")) {
                await deleteMenuItem(id);
                loadMenu();
            }
        };

        window.handleClearMenu = async () => {
            if (confirm("Tout vider ?")) {
                await clearMenu();
                loadMenu();
            }
        };

        window.handleRestoreMenu = async () => {
            if (confirm("Restaurer ?")) {
                await restoreMenu();
                loadMenu();
            }
        };

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                category: document.getElementById('category').value,
                categoryAr: document.getElementById('categoryAr').value,
                nameFr: document.getElementById('nameFr').value,
                nameAr: document.getElementById('nameAr').value,
                price: document.getElementById('price').value
            };

            try {
                if (id) await updateMenuItem(id, data);
                else await addMenuItem(data);
                closeModal();
                loadMenu();
            } catch (err) { alert(err.message); }
        });
    </script>
</body>

</html>
