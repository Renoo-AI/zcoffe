<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZCOFFEE | Accès Admin Sécurisé</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><clipPath id='s'><rect width='100' height='100' rx='30'/></clipPath></defs><g clip-path='url(%23s)'><rect width='50' height='100' fill='%232d2a26'/><rect x='50' width='50' height='100' fill='%23b48c68'/><text y='72' x='50' text-anchor='middle' font-family='Georgia,serif' font-weight='900' font-size='65' fill='%23faf9f6'>Z</text></g></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #faf9f6;
            --text: #2d2a26;
            --accent: #b48c68;
            --accent-light: #d4bc9c;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 60px rgba(45, 42, 38, 0.05);
            z-index: 10;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(45, 42, 38, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(180, 140, 104, 0.1);
        }

        .btn-premium {
            background-color: var(--text);
            color: white;
            transition: all 0.4s ease;
        }

        .btn-premium:hover:not(:disabled) {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(45, 42, 38, 0.1);
        }

        .btn-premium:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .step-transition {
            transition: all 0.5s ease-in-out;
        }
    </style>
</head>

<body class="hidden" id="page">

    <div class="glass-card p-10 md:p-12 rounded-[2.5rem] w-full max-w-sm mx-4 text-center">
        <div class="mb-10">
            <div class="w-14 h-14 bg-[#2d2a26] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <svg width="28" height="28" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#b48c68" d="M2 2h6v1H4v1h4v1H2v1h6v1H2V2z" />
                </svg>
            </div>
            <h1 class="serif text-3xl font-bold tracking-tight mb-2 uppercase">ZCOFFEE</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] opacity-40 font-bold">Système Autonome Sécurisé</p>
        </div>

        <!-- Step 1: Credentials -->
        <form id="loginForm" class="space-y-4 step-transition">
            <div class="text-left">
                <label class="block text-[10px] uppercase font-bold tracking-widest opacity-40 mb-2 ml-1">Identifiant</label>
                <input type="text" id="username" required
                    class="input-field w-full px-5 py-4 rounded-2xl focus:outline-none text-sm"
                    placeholder="Nom d'utilisateur">
            </div>
            <div class="text-left">
                <label class="block text-[10px] uppercase font-bold tracking-widest opacity-40 mb-2 ml-1">Mot de passe</label>
                <input type="password" id="password" required
                    class="input-field w-full px-5 py-4 rounded-2xl focus:outline-none text-sm"
                    placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn"
                class="btn-premium w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px] mt-4">
                Connexion
            </button>
        </form>

        <!-- Step 2: MFA (Hidden initially) -->
        <form id="mfaForm" class="space-y-6 step-transition hidden">
            <div class="text-center mb-4">
                <p class="text-xs opacity-60">Veuillez saisir le code de sécurité généré par votre application MFA.</p>
            </div>
            <div class="flex justify-center gap-2" id="otp-container">
                <input type="text" id="otp" required maxlength="6"
                    class="input-field w-full px-5 py-4 rounded-2xl focus:outline-none text-center text-2xl font-bold tracking-[0.5em]"
                    placeholder="000000">
            </div>
            <button type="submit" id="verifyBtn"
                class="btn-premium w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px]">
                Vérifier le code
            </button>
            <button type="button" id="backBtn" class="text-[9px] uppercase font-bold opacity-30 hover:opacity-100 transition-opacity">
                Retour
            </button>
        </form>

        <div id="error" class="hidden mt-6">
            <p id="errorText" class="text-rose-500 text-[10px] font-bold uppercase tracking-widest leading-relaxed"></p>
        </div>

        <div class="pt-8">
            <a href="../zcoffee-secret-2026.html"
                class="text-[9px] uppercase font-bold opacity-30 hover:opacity-100 transition-opacity tracking-[0.2em]">
                Sortie Sécurisée
            </a>
        </div>
    </div>

    <script type="module">
        import { login, verifyMFA } from "./security_utils.js";

        // Sécurité : Si la clé n'a pas été saisie, on retourne à l'index secret
        if (sessionStorage.getItem('key_cleared') !== 'true') {
            window.location.href = '../zcoffee-secret-2026.html';
        } else {
            document.getElementById('page').classList.remove('hidden');
        }

        const loginForm = document.getElementById('loginForm');
        const mfaForm = document.getElementById('mfaForm');
        const errorDiv = document.getElementById('error');
        const errorText = document.getElementById('errorText');

        let currentMfaToken = null;

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const response = await login(username, password);
                if (response.mfaToken) {
                    currentMfaToken = response.mfaToken;
                    loginForm.classList.add('hidden');
                    mfaForm.classList.remove('hidden');
                } else if (response.success) {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                errorText.innerText = err.message || "Erreur d'authentification";
                errorDiv.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
            }
        });

        mfaForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const verifyBtn = document.getElementById('verifyBtn');

            verifyBtn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const success = await verifyMFA(currentMfaToken, otp);
                if (success) {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                errorText.innerText = err.message || "Code MFA invalide";
                errorDiv.classList.remove('hidden');
            } finally {
                verifyBtn.disabled = false;
            }
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            mfaForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        });
    </script>
</body>

</html>
